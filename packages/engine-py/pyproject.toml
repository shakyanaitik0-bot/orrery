[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "orrery-engine"
version = "0.1.0"
description = "Adaptive learning algorithms (BKT, SM-2) for Orrery, harvested from skillcoco-core."
requires-python = ">=3.11"

[tool.maturin]
features = ["pyo3/extension-module"]
